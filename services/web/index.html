<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Найдите попутку, разделите дорогу или вызовите машину рядом. D-Tramp — Попутчик найдётся — дорога начнётся." />
    <meta name="theme-color" content="#f5f6f8" />
    <script>
      try {
        var saved = localStorage.getItem('dtramp.theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (_) { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <title>D-Tramp — Попутчик найдётся — дорога начнётся</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
