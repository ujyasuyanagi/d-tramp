server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # DNS докера: резолвим шлюз на каждый запрос, чтобы 502 не появлялся
  # после перезапуска api-gateway с новым адресом внутри сети.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /graphql {
    set $gateway http://api-gateway:4000;
    proxy_pass $gateway/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Content-Type $content_type;
    proxy_read_timeout 30s;
  }

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # SPA: любой путь отдаёт index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|svg|woff2?)$ {
    expires 7d;
    try_files $uri =404;
  }
}
