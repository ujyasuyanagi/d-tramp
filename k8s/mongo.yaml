apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - name: mongodb
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          # mongosh стартует дольше секунды (default timeout probe), поэтому таймауты
          # увеличены. startupProbe не даёт liveness убить mongo во время первого старта.
          startupProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: mongodb
